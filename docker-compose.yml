# DevBrain: `docker compose up --build` starts everything.
# Settings come from .env next to this file (copy .env.example to .env); every value has a default here.
#
# Infrastructure only (to run the backend/frontend from source):
#   docker compose up -d postgres neo4j kafka

name: devbrain

services:
  # PostgreSQL with pgvector: documents + embeddings
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devbrain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devbrain}
      POSTGRES_USER: ${POSTGRES_USER:-devbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devbrain}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Neo4j: the knowledge graph (typed relationships, topic clustering)
  neo4j:
    image: neo4j:5-community
    container_name: devbrain-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-devbrain123}
      # graph-data-science: Leiden community detection for the hierarchical topic clusters
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"  # Browser UI
      - "${NEO4J_BOLT_PORT:-7687}:7687"  # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: devbrain-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Kafka: async ingestion queue. Containers use kafka:29092; the host uses localhost:9092.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: devbrain-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  # Spring Boot API (ingestion, search, graph, chat, research)
  backend:
    build:
      context: .
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
    container_name: devbrain-backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in .env (see .env.example)}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-devbrain}
      POSTGRES_USER: ${POSTGRES_USER:-devbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devbrain}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-devbrain123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPICS_LLM_NAMES: ${TOPICS_LLM_NAMES:-true}
      WHISPER_ENABLED: ${WHISPER_ENABLED:-true}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  # Next.js web UI
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: devbrain-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
  neo4j_data:
