spring:
  application:
    name: devbrain

  # PostgreSQL + pgvector
  datasource:
    url: jdbc:postgresql://localhost:5433/devbrain
    username: devbrain
    password: devbrain
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Neo4j
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: devbrain123

  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: devbrain-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

logging:
  level:
    # Neo4j planner notices about MATCH (a), (b) before MERGE; harmless, ids are unique
    org.springframework.data.neo4j.cypher.performance: warn

# Langchain4j / Anthropic Claude config
langchain4j:
  anthropic:
    chat-model:
      api-key: ${ANTHROPIC_API_KEY:demo}
      model-name: claude-haiku-5-5
      max-tokens: 4096

# DevBrain custom config
devbrain:
  knowledge:
    similarity-threshold: 0.62
    max-text-length: 8000
  whisper:
    enabled: true
    binary: whisper-cli
    model: ${user.home}/.devbrain/models/ggml-base.en.bin
  kafka:
    topic:
      ingestion: devbrain.ingestion
      research: devbrain.research
